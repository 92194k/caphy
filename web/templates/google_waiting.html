<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CAPHY - Signing in with Google</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body{align-items:center;justify-content:center}
    .box{background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:38px;width:380px;text-align:center}
    .spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);
      border-top-color:var(--teal);margin:0 auto 18px;animation:spin 0.9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .msg{color:var(--text);font-size:14px;margin-bottom:8px}
    .sub{color:var(--muted);font-size:12px;line-height:1.5}
    .error{color:var(--red);font-size:13px;margin-top:14px}
    .retry{color:var(--teal2);cursor:pointer;font-size:12px;margin-top:16px;display:none}
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div class="msg" id="msg">Waiting for Google Sign-In…</div>
    <div class="sub">A browser window opened to sign in with Google.<br>
      Finish signing in there, then come back to this window.</div>
    <div class="error" id="error"></div>
    <div class="retry" id="retry" onclick="window.location.href='/login'">← Back to Sign In</div>
  </div>

  <script>
    const state = {{ state|tojson }};
    let tries = 0;

    async function poll() {
      tries++;
      try {
        const r = await fetch('/api/auth/google/status?state=' + encodeURIComponent(state));
        const d = await r.json();
        if (d.done) {
          if (d.error) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('msg').textContent = 'Sign in failed';
            document.getElementById('error').textContent = d.error;
            document.getElementById('retry').style.display = 'block';
            return;
          }
          document.getElementById('msg').textContent = 'Signed in! Loading CAPHY…';
          window.location.href = d.next || '/';
          return;
        }
      } catch (e) {
        // Network hiccup mid-poll - keep trying, don't give up on one blip.
      }
      // Stop after ~10 minutes (400 tries * 1.5s) so this doesn't spin forever
      // if the user closes the browser tab without finishing.
      if (tries < 400) {
        setTimeout(poll, 1500);
      } else {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('msg').textContent = 'Timed out waiting for sign-in';
        document.getElementById('retry').style.display = 'block';
      }
    }
    poll();
  </script>
</body>
</html>
