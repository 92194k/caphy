<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CAPHY - Signing in with Google</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body{align-items:center;justify-content:center}
    .box{background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:38px;width:380px;text-align:center}
    .spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);
      border-top-color:var(--teal);margin:0 auto 18px;animation:spin 0.9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .msg{color:var(--text);font-size:14px;margin-bottom:8px}
    .sub{color:var(--muted);font-size:12px;line-height:1.5}
    .error{color:var(--red);font-size:13px;margin-top:14px}
    .retry{color:var(--teal2);cursor:pointer;font-size:12px;margin-top:16px;display:none}
  </style>
</head>
<body>
<div class="app-titlebar" id="appTitlebar">
    <div class="atb-brand">
      <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="atbg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b7bff"></stop><stop offset="1" stop-color="#a78bfa"></stop>
        </linearGradient></defs>
        <path d="M48 6 L82 18 V44 C82 66 66 82 48 90 C30 82 14 66 14 44 V18 Z" fill="url(#atbg)"></path>
      </svg>
      <span>CAPHY Console</span>
    </div>
    <div class="atb-btns" id="atbBtns">
      <button class="atb-btn" id="atbMin" title="Minimize" type="button">
        <svg viewBox="0 0 11 11"><rect x="0" y="5" width="11" height="1.4" fill="currentColor"></rect></svg>
      </button>
      <button class="atb-btn" id="atbMax" title="Maximize" type="button">
        <svg id="atbMaxIcon" viewBox="0 0 11 11"><rect x="0.75" y="0.75" width="9.5" height="9.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"></rect></svg>
      </button>
      <button class="atb-btn atb-close" id="atbClose" title="Close" type="button">
        <svg viewBox="0 0 11 11"><path d="M0.5 0.5l10 10M10.5 0.5l-10 10" stroke="currentColor" stroke-width="1.3"></path></svg>
      </button>
    </div>
  </div>
  <script>
  (function(){
    var ICON_MAXIMIZE = '<rect x="0.75" y="0.75" width="9.5" height="9.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"></rect>';
    var ICON_RESTORE = '<rect x="2.5" y="0.75" width="7.75" height="7.75" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"></rect>'
      + '<path d="M0.75 3.25V9.5a0.75 0.75 0 0 0 0.75 0.75H7.75" fill="none" stroke="currentColor" stroke-width="1.2"></path>';

    function wireAppTitlebar(){
      // Only activate inside the packaged desktop window (pywebview's JS
      // bridge) - not in an ordinary browser tab or the phone-facing
      // dashboard view, where there is real OS/browser chrome already and
      // this bar would just be extra clutter with non-functional buttons.
      if(!window.pywebview || !window.pywebview.api) return;
      document.body.classList.add('has-app-titlebar');
      var btns = document.getElementById('atbBtns');
      if(btns) btns.style.display = 'flex';
      var min = document.getElementById('atbMin');
      var max = document.getElementById('atbMax');
      var maxIcon = document.getElementById('atbMaxIcon');
      var close = document.getElementById('atbClose');
      var isMax = false;
      function setMaxIcon(){
        if(maxIcon) maxIcon.innerHTML = isMax ? ICON_RESTORE : ICON_MAXIMIZE;
        if(max) max.title = isMax ? 'Restore' : 'Maximize';
      }
      if(min) min.onclick = function(){ window.pywebview.api.minimize_window(); };
      if(max) max.onclick = function(){
        window.pywebview.api.toggle_maximize_window();
        isMax = !isMax;
        setMaxIcon();
      };
      if(close) close.onclick = function(){ window.pywebview.api.close_window(); };
      // Double-click the bar itself also toggles maximize, matching the
      // familiar behavior of a normal app's title bar.
      var bar = document.getElementById('appTitlebar');
      if(bar) bar.ondblclick = function(e){
        if(e.target.closest('.atb-btn')) return;
        window.pywebview.api.toggle_maximize_window();
        isMax = !isMax;
        setMaxIcon();
      };
    }
    window.addEventListener('pywebviewready', wireAppTitlebar);
    // pywebviewready can fire before this script runs, so also check now.
    if(window.pywebview) wireAppTitlebar();
  })();
  </script>

  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div class="msg" id="msg">Waiting for Google Sign-In…</div>
    <div class="sub">A browser window opened to sign in with Google.<br>
      Finish signing in there, then come back to this window.</div>
    <div class="error" id="error"></div>
    <div class="retry" id="retry" onclick="window.location.href='/login'">← Back to Sign In</div>
  </div>

  <script>
    const state = {{ state|tojson }};
    let tries = 0;

    async function poll() {
      tries++;
      try {
        const r = await fetch('/api/auth/google/status?state=' + encodeURIComponent(state));
        const d = await r.json();
        if (d.done) {
          if (d.error) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('msg').textContent = 'Sign in failed';
            document.getElementById('error').textContent = d.error;
            document.getElementById('retry').style.display = 'block';
            return;
          }
          document.getElementById('msg').textContent = 'Signed in! Loading CAPHY…';
          window.location.href = d.next || '/';
          return;
        }
      } catch (e) {
        // Network hiccup mid-poll - keep trying, don't give up on one blip.
      }
      // Stop after ~10 minutes (400 tries * 1.5s) so this doesn't spin forever
      // if the user closes the browser tab without finishing.
      if (tries < 400) {
        setTimeout(poll, 1500);
      } else {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('msg').textContent = 'Timed out waiting for sign-in';
        document.getElementById('retry').style.display = 'block';
      }
    }
    poll();
  </script>
</body>
</html>
