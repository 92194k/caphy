<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CAPHY - Set Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body{align-items:center;justify-content:center}
    .box{background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:38px;width:380px}
    .box .logo{width:56px;height:56px;border-radius:14px;margin:0 auto 12px}
    .error{color:var(--red);font-size:12px;margin-top:10px}
    .success{color:var(--teal);font-size:12px;margin-top:10px}
    .hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin-bottom:18px;text-align:center}
    input{width:100%;padding:8px;margin-top:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}
    label{display:block;margin-top:12px}
    .skip{color:var(--teal2);cursor:pointer;font-size:12px;text-align:center;margin-top:16px}
    .pwd-wrap{position:relative}
    .pwd-wrap input{padding-right:38px !important}
    .pwd-toggle{position:absolute;right:8px;top:calc(50% + 3px);transform:translateY(-50%);
      cursor:pointer;color:var(--muted);width:22px;height:22px;display:flex;
      align-items:center;justify-content:center;user-select:none}
    .pwd-toggle:hover{color:var(--teal2)}
    .caps-hint{display:none;color:var(--orange,#F4A261);font-size:11px;margin-top:6px;
      align-items:center;gap:6px}
    .caps-hint.show{display:flex}
  </style>
</head>
<body>
<div class="app-titlebar" id="appTitlebar">
    <div class="atb-brand">
      <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="atbg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b7bff"></stop><stop offset="1" stop-color="#a78bfa"></stop>
        </linearGradient></defs>
        <path d="M48 6 L82 18 V44 C82 66 66 82 48 90 C30 82 14 66 14 44 V18 Z" fill="url(#atbg)"></path>
      </svg>
      <span>CAPHY Console</span>
    </div>
    <div class="atb-btns" id="atbBtns">
      <button class="atb-btn" id="atbMin" title="Minimize" type="button">
        <svg viewBox="0 0 11 11"><rect x="0" y="5" width="11" height="1.4" fill="currentColor"></rect></svg>
      </button>
      <button class="atb-btn" id="atbMax" title="Maximize" type="button">
        <svg id="atbMaxIcon" viewBox="0 0 11 11"><rect x="0.75" y="0.75" width="9.5" height="9.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"></rect></svg>
      </button>
      <button class="atb-btn atb-close" id="atbClose" title="Close" type="button">
        <svg viewBox="0 0 11 11"><path d="M0.5 0.5l10 10M10.5 0.5l-10 10" stroke="currentColor" stroke-width="1.3"></path></svg>
      </button>
    </div>
  </div>
  <script>
  (function(){
    var ICON_MAXIMIZE = '<rect x="0.75" y="0.75" width="9.5" height="9.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"></rect>';
    var ICON_RESTORE = '<rect x="2.5" y="0.75" width="7.75" height="7.75" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"></rect>'
      + '<path d="M0.75 3.25V9.5a0.75 0.75 0 0 0 0.75 0.75H7.75" fill="none" stroke="currentColor" stroke-width="1.2"></path>';

    function wireAppTitlebar(){
      // Only activate inside the packaged desktop window (pywebview's JS
      // bridge) - not in an ordinary browser tab or the phone-facing
      // dashboard view, where there is real OS/browser chrome already and
      // this bar would just be extra clutter with non-functional buttons.
      if(!window.pywebview || !window.pywebview.api) return;
      document.body.classList.add('has-app-titlebar');
      var btns = document.getElementById('atbBtns');
      if(btns) btns.style.display = 'flex';
      var min = document.getElementById('atbMin');
      var max = document.getElementById('atbMax');
      var maxIcon = document.getElementById('atbMaxIcon');
      var close = document.getElementById('atbClose');
      var isMax = false;
      function setMaxIcon(){
        if(maxIcon) maxIcon.innerHTML = isMax ? ICON_RESTORE : ICON_MAXIMIZE;
        if(max) max.title = isMax ? 'Restore' : 'Maximize';
      }
      if(min) min.onclick = function(){ window.pywebview.api.minimize_window(); };
      if(max) max.onclick = function(){
        window.pywebview.api.toggle_maximize_window();
        isMax = !isMax;
        setMaxIcon();
      };
      if(close) close.onclick = function(){ window.pywebview.api.close_window(); };
      // Double-click the bar itself also toggles maximize, matching the
      // familiar behavior of a normal app's title bar.
      var bar = document.getElementById('appTitlebar');
      if(bar) bar.ondblclick = function(e){
        if(e.target.closest('.atb-btn')) return;
        window.pywebview.api.toggle_maximize_window();
        isMax = !isMax;
        setMaxIcon();
      };
    }
    window.addEventListener('pywebviewready', wireAppTitlebar);
    // pywebviewready can fire before this script runs, so also check now.
    if(window.pywebview) wireAppTitlebar();
  })();
  </script>

  <div class="box">
    <div style="text-align:center;margin-bottom:6px">
      <div class="logo" style="overflow:hidden">
        <img class="caphy-logo" src="{{ url_for('static', filename='img/caphy_icon_256.png') }}" alt="CAPHY" width="100%" height="100%">
      </div>
      <b style="font-size:22px;letter-spacing:3px">CAPHY</b>
    </div>

    <div class="hint">
      You signed in with Google ({{ email }}).<br>
      Set a password so you can also sign in with your email directly.
    </div>

    <form method="post" action="{{ url_for('set_password') }}">
      <label>NEW PASSWORD</label>
      <div class="pwd-wrap">
        <input id="set-password" name="password" type="password" placeholder="Min. 6 characters" required
               onkeyup="checkCaps(event,'set-caps')">
        <span class="pwd-toggle" onclick="togglePwd('set-password',this)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </div>

      <label>CONFIRM PASSWORD</label>
      <div class="pwd-wrap">
        <input id="set-password-confirm" name="password_confirm" type="password" required
               onkeyup="checkCaps(event,'set-caps')">
        <span class="pwd-toggle" onclick="togglePwd('set-password-confirm',this)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </div>
      <div id="set-caps" class="caps-hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2 L3 12 h5 v8 h8 v-8 h5 Z"/>
        </svg>
        Caps Lock is on
      </div>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <button class="btn" type="submit" style="width:100%;margin-top:18px;padding:12px">Set Password</button>
    </form>

    <script>
      function togglePwd(inputId, iconEl) {
        const el = document.getElementById(inputId);
        const showing = el.type === 'text';
        el.type = showing ? 'password' : 'text';
        iconEl.innerHTML = showing
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
            + '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
            + '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/>'
            + '<path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/></svg>';
      }
      function checkCaps(evt, hintId) {
        const hint = document.getElementById(hintId);
        if (!hint) return;
        const on = typeof evt.getModifierState === 'function'
          && evt.getModifierState('CapsLock');
        hint.classList.toggle('show', !!on);
      }
    </script>

    <div class="skip" onclick="window.location.href='{{ url_for('dashboard') }}'">
      Skip for now
    </div>
  </div>
</body>
</html>
