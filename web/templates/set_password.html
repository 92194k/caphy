<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CAPHY - Set Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body{align-items:center;justify-content:center}
    .box{background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:38px;width:380px}
    .box .logo{width:56px;height:56px;border-radius:14px;margin:0 auto 12px}
    .error{color:var(--red);font-size:12px;margin-top:10px}
    .success{color:var(--teal);font-size:12px;margin-top:10px}
    .hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin-bottom:18px;text-align:center}
    input{width:100%;padding:8px;margin-top:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}
    label{display:block;margin-top:12px}
    .skip{color:var(--teal2);cursor:pointer;font-size:12px;text-align:center;margin-top:16px}
    .pwd-wrap{position:relative}
    .pwd-wrap input{padding-right:38px !important}
    .pwd-toggle{position:absolute;right:8px;top:calc(50% + 3px);transform:translateY(-50%);
      cursor:pointer;color:var(--muted);width:22px;height:22px;display:flex;
      align-items:center;justify-content:center;user-select:none}
    .pwd-toggle:hover{color:var(--teal2)}
    .caps-hint{display:none;color:var(--orange,#F4A261);font-size:11px;margin-top:6px;
      align-items:center;gap:6px}
    .caps-hint.show{display:flex}
  </style>
</head>
<body>
  <div class="box">
    <div style="text-align:center;margin-bottom:6px">
      <div class="logo" style="overflow:hidden">
        <img class="caphy-logo" src="{{ url_for('static', filename='img/caphy_icon_256.png') }}" alt="CAPHY" width="100%" height="100%">
      </div>
      <b style="font-size:22px;letter-spacing:3px">CAPHY</b>
    </div>

    <div class="hint">
      You signed in with Google ({{ email }}).<br>
      Set a password so you can also sign in with your email directly.
    </div>

    <form method="post" action="{{ url_for('set_password') }}">
      <label>NEW PASSWORD</label>
      <div class="pwd-wrap">
        <input id="set-password" name="password" type="password" placeholder="Min. 6 characters" required
               onkeyup="checkCaps(event,'set-caps')">
        <span class="pwd-toggle" onclick="togglePwd('set-password',this)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </div>

      <label>CONFIRM PASSWORD</label>
      <div class="pwd-wrap">
        <input id="set-password-confirm" name="password_confirm" type="password" required
               onkeyup="checkCaps(event,'set-caps')">
        <span class="pwd-toggle" onclick="togglePwd('set-password-confirm',this)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </div>
      <div id="set-caps" class="caps-hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2 L3 12 h5 v8 h8 v-8 h5 Z"/>
        </svg>
        Caps Lock is on
      </div>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <button class="btn" type="submit" style="width:100%;margin-top:18px;padding:12px">Set Password</button>
    </form>

    <script>
      function togglePwd(inputId, iconEl) {
        const el = document.getElementById(inputId);
        const showing = el.type === 'text';
        el.type = showing ? 'password' : 'text';
        iconEl.innerHTML = showing
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
            + '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
            + '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/>'
            + '<path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/></svg>';
      }
      function checkCaps(evt, hintId) {
        const hint = document.getElementById(hintId);
        if (!hint) return;
        const on = typeof evt.getModifierState === 'function'
          && evt.getModifierState('CapsLock');
        hint.classList.toggle('show', !!on);
      }
    </script>

    <div class="skip" onclick="window.location.href='{{ url_for('dashboard') }}'">
      Skip for now
    </div>
  </div>
</body>
</html>
