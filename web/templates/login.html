<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CAPHY - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body{align-items:center;justify-content:center}
    .box{background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:38px;width:370px}
    .box .logo{width:56px;height:56px;border-radius:14px;margin:0 auto 12px}
    .remember{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12.5px}
    .remember label{display:flex;align-items:center;gap:8px;color:var(--muted);margin:0;cursor:pointer}
    .remember input{width:16px;height:16px;padding:0;accent-color:var(--teal)}
    .forgot{color:var(--teal2);cursor:pointer}
    .hint{display:none;color:var(--muted);font-size:11.5px;background:var(--bg2);border:1px solid var(--line);
      border-radius:9px;padding:10px 12px;margin-top:12px;line-height:1.5}
  </style>
</head>
<body>
  <div class="box">
    <div style="text-align:center;margin-bottom:6px">
      <div class="logo" style="overflow:hidden">
        <svg class="caphy-logo" viewBox="24 24 72 72" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2A9D8F"></stop><stop offset="1" stop-color="#217C72"></stop>
          </linearGradient>
          <clipPath id="lc"><rect x="24" y="24" width="72" height="72" rx="17"></rect></clipPath></defs>
          <rect x="24" y="24" width="72" height="72" rx="17" fill="url(#lg)"></rect>
          <g clip-path="url(#lc)">
            <ellipse class="eye" cx="60" cy="60" rx="21" ry="13" fill="#08110f"></ellipse>
            <g class="pupil">
              <circle cx="60" cy="60" r="8.5" fill="#3dd7c4"></circle>
            </g>
          </g>
        </svg>
      </div>
      <b style="font-size:26px;letter-spacing:3px">CAPHY</b>
      <div style="color:var(--teal2);font-size:11px;letter-spacing:3px">AI SECURITY</div>
    </div>
    <form method="post">
      <label>USERNAME</label><input name="username" value="admin" style="width:100%">
      <label>PASSWORD</label><input name="password" type="password" style="width:100%">
      <div class="remember">
        <label><input type="checkbox" name="remember" value="on"> Remember this device</label>
        <span class="forgot" onclick="document.getElementById('h').style.display='block'">Forgot?</span>
      </div>
      <div id="h" class="hint">
        This console runs locally on your device. If you're locked out, reset the password from
        <b>Settings &rarr; Users</b> on a signed-in device, or restore the default <b>admin / admin</b>.
      </div>
      <div style="color:var(--red);font-size:12px;margin-top:10px">{{ err }}</div>
      <button class="btn" style="width:100%;margin-top:18px;padding:12px">Sign In</button>
    </form>
    <div style="color:var(--dim);font-size:11px;text-align:center;margin-top:16px">Default: admin / admin</div>
  </div>
  <script>
    (function(){var d=-(Date.now()%4200)+'ms';
      document.querySelectorAll('.caphy-logo .eye,.caphy-logo .pupil')
        .forEach(function(e){e.style.animationDelay=d;});})();
  </script>
</body>
</html>
