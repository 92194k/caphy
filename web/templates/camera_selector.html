<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPHY - Camera Selector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title .icon {
            font-size: 18px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-scan {
            background: #667eea;
            color: white;
        }

        .btn-scan:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-scan:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-test {
            background: #48bb78;
            color: white;
        }

        .btn-test:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-test:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-select {
            background: #ed8936;
            color: white;
            width: 100%;
        }

        .btn-select:hover:not(:disabled) {
            background: #dd6b20;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(237, 137, 54, 0.4);
        }

        .btn-select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .camera-list {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .camera-item {
            background: white;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .camera-item:last-child {
            margin-bottom: 0;
        }

        .camera-item:hover {
            border-color: #667eea;
            background: #edf2f7;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .camera-item input[type="radio"] {
            margin-right: 10px;
        }

        .camera-item-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: 100%;
        }

        .camera-info {
            flex: 1;
        }

        .camera-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .camera-type {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }

        .camera-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .camera-badge.network {
            background: #48bb78;
        }

        .status-box {
            background: #edf2f7;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .status-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .status-box.success {
            border-left-color: #48bb78;
            background: #f0fff4;
        }

        .status-box.success .status-value {
            color: #22543d;
        }

        .status-box.error {
            border-left-color: #f56565;
            background: #fff5f5;
        }

        .status-box.error .status-value {
            color: #742a2a;
        }

        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px 20px;
            font-size: 14px;
        }

        .empty-state p {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 CAPHY Camera Setup</h1>
            <p>Select your camera source for motion detection and monitoring</p>
        </div>

        <div class="section">
            <div class="section-title">
                <span class="icon">🔍</span>
                Scan & Detect
            </div>
            <div class="button-group">
                <button class="btn-scan" onclick="scanCameras()" id="scan-btn">
                    <span id="scan-text">Scan for Cameras</span>
                </button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <span class="icon">📹</span>
                Available Cameras
            </div>
            <div class="camera-list" id="camera-list">
                <div class="empty-state">
                    <p>Click "Scan for Cameras" to detect available cameras</p>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <span class="icon">✓</span>
                Selected Camera
            </div>
            <div class="status-box" id="status-box">
                <div class="status-label">Current Selection</div>
                <div class="status-value" id="selected-camera-display">None</div>
            </div>
            <button class="btn-test" onclick="testSelectedCamera()" id="test-btn" disabled>✓ Test Connection</button>
        </div>

        <div class="section">
            <button class="btn-select" onclick="confirmSelection()" id="confirm-btn" disabled>✓ Confirm & Save</button>
        </div>
    </div>

    <script>
        let cameras = { local: [], network: [] };
        let selectedCamera = null;

        async function scanCameras() {
            const scanBtn = document.getElementById('scan-btn');
            const originalText = scanBtn.innerHTML;
            scanBtn.innerHTML = '<span class="loader"></span> Scanning...';
            scanBtn.disabled = true;

            try {
                const response = await fetch('/api/detector/cameras');
                cameras = await response.json();

                displayCameras();

                // Load saved camera
                const savedResponse = await fetch('/api/detector/cameras/saved');
                const saved = await savedResponse.json();
                if (saved.saved_camera) {
                    selectCamera(saved.saved_camera);
                }
            } catch (error) {
                alert('Error scanning cameras: ' + error);
                console.error(error);
            } finally {
                scanBtn.innerHTML = originalText;
                scanBtn.disabled = false;
            }
        }

        function displayCameras() {
            let html = '';

            if (cameras.local.length === 0 && cameras.network.length === 0) {
                html = '<div class="empty-state"><p>No cameras detected. Check connections and scan again.</p></div>';
            } else {
                // Local cameras
                if (cameras.local.length > 0) {
                    html += '<div style="margin-bottom: 10px;">';
                    cameras.local.forEach(cam => {
                        html += `
                            <div class="camera-item">
                                <label class="camera-item-label">
                                    <input type="radio" name="camera" value="${cam.source}" onchange="selectCamera(${cam.source})">
                                    <div class="camera-info">
                                        <div class="camera-name">📌 ${cam.name}</div>
                                        <div class="camera-type">${cam.type}</div>
                                    </div>
                                    <span class="camera-badge">Local</span>
                                </label>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                // Network cameras
                if (cameras.network.length > 0) {
                    html += '<div>';
                    cameras.network.forEach(cam => {
                        html += `
                            <div class="camera-item">
                                <label class="camera-item-label">
                                    <input type="radio" name="camera" value="${cam.source}" onchange="selectCamera('${cam.source}')">
                                    <div class="camera-info">
                                        <div class="camera-name">🌐 ${cam.name}</div>
                                        <div class="camera-type">${cam.type}</div>
                                    </div>
                                    <span class="camera-badge network">IP Camera</span>
                                </label>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
            }

            document.getElementById('camera-list').innerHTML = html;
        }

        function selectCamera(cameraSource) {
            selectedCamera = cameraSource;

            // Update radio buttons
            document.querySelectorAll('input[name="camera"]').forEach(radio => {
                radio.checked = (radio.value === String(cameraSource));
            });

            // Update status display
            let displayText = cameraSource;
            const allCameras = [...cameras.local, ...cameras.network];
            const selectedCam = allCameras.find(cam => cam.source === cameraSource);
            if (selectedCam) {
                displayText = selectedCam.name;
            }

            document.getElementById('selected-camera-display').textContent = displayText;
            document.getElementById('status-box').classList.remove('success', 'error');
            document.getElementById('test-btn').disabled = false;
            document.getElementById('confirm-btn').disabled = false;
        }

        async function testSelectedCamera() {
            if (!selectedCamera) {
                alert('Please select a camera first');
                return;
            }

            const testBtn = document.getElementById('test-btn');
            const originalText = testBtn.innerHTML;
            testBtn.innerHTML = '<span class="loader"></span> Testing...';
            testBtn.disabled = true;

            try {
                const response = await fetch('/api/detector/cameras/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ camera: selectedCamera })
                });

                const result = await response.json();
                const statusBox = document.getElementById('status-box');

                if (result.connected) {
                    statusBox.classList.add('success');
                    statusBox.classList.remove('error');
                    alert('✓ Camera connected successfully!');
                } else {
                    statusBox.classList.add('error');
                    statusBox.classList.remove('success');
                    alert('✗ Camera connection failed: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error testing camera: ' + error);
                console.error(error);
            } finally {
                testBtn.innerHTML = originalText;
                testBtn.disabled = false;
            }
        }

        async function confirmSelection() {
            if (!selectedCamera) {
                alert('Please select a camera first');
                return;
            }

            const confirmBtn = document.getElementById('confirm-btn');
            const originalText = confirmBtn.innerHTML;
            confirmBtn.innerHTML = '<span class="loader"></span> Saving...';
            confirmBtn.disabled = true;

            try {
                const response = await fetch('/api/detector/cameras/select', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ camera: selectedCamera })
                });

                const result = await response.json();
                if (result.ok) {
                    alert('✓ Camera saved! Your system will use this camera for offline operation.\n\nYou can close this window.');
                    // Optional: redirect back to main console
                    setTimeout(() => { window.location.href = '/'; }, 2000);
                } else {
                    alert('Error saving camera: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error confirming selection: ' + error);
                console.error(error);
            } finally {
                confirmBtn.innerHTML = originalText;
                confirmBtn.disabled = false;
            }
        }

        // Auto-load saved camera on page load
        window.addEventListener('load', async () => {
            try {
                const savedResponse = await fetch('/api/detector/cameras/saved');
                const saved = await savedResponse.json();
                if (saved.saved_camera) {
                    selectedCamera = saved.saved_camera;
                    const allCameras = [...cameras.local, ...cameras.network];
                    const selectedCam = allCameras.find(cam => cam.source === selectedCamera);
                    if (selectedCam) {
                        document.getElementById('selected-camera-display').textContent = selectedCam.name;
                    } else {
                        document.getElementById('selected-camera-display').textContent = String(selectedCamera);
                    }
                    document.getElementById('test-btn').disabled = false;
                    document.getElementById('confirm-btn').disabled = false;
                }
            } catch (error) {
                console.error('Error loading saved camera:', error);
            }
        });
    </script>
</body>
</html>
