<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CAPHY - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { background: var(--panel2); border: 1px solid var(--line2); border-radius: 16px; padding: 40px; width: 400px; }
    .logo { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 12px; overflow: hidden; }
    input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg2); box-sizing: border-box; }
    label { display: block; margin-top: 12px; font-weight: 500; }
    .btn { width: 100%; padding: 12px; margin-top: 18px; }
    .error { color: var(--red); font-size: 12px; margin-top: 10px; }
    .success { color: var(--teal); font-size: 12px; margin-top: 10px; }
    .toggle { text-align: center; margin-top: 16px; font-size: 12px; }
    .toggle a { color: var(--teal2); cursor: pointer; text-decoration: underline; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: var(--bg2); color: var(--text); cursor: pointer; border-radius: 6px; }
    .tab-btn.active { background: var(--teal); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="box">
    <div style="text-align: center; margin-bottom: 20px;">
      <div class="logo" style="overflow: hidden;">
        <svg class="caphy-logo" viewBox="24 24 72 72" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2A9D8F"></stop>
              <stop offset="1" stop-color="#217C72"></stop>
            </linearGradient>
          </defs>
          <rect x="24" y="24" width="72" height="72" rx="17" fill="url(#lg)"></rect>
          <circle cx="60" cy="60" r="8.5" fill="#3dd7c4"></circle>
        </svg>
      </div>
      <b style="font-size: 26px; letter-spacing: 3px;">CAPHY</b>
      <div style="color: var(--teal2); font-size: 11px; letter-spacing: 3px;">AI SECURITY</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- SIGN IN TAB -->
    <div id="signin" class="tab-content active">
      <form method="POST" action="{{ url_for('login') }}">
        <label>EMAIL</label>
        <input type="email" name="email" placeholder="you@example.com" required>

        <label>PASSWORD</label>
        <input type="password" name="password" required>

        <label style="margin-top: 12px;">
          <input type="checkbox" name="remember" value="on"> Remember me
        </label>

        {% if error %}
          <div class="error">{{ error }}</div>
        {% endif %}

        <button class="btn" type="submit">Sign In</button>
      </form>
    </div>

    <!-- SIGN UP TAB -->
    <div id="signup" class="tab-content">
      <form onsubmit="handleSignup(event)">
        <label>EMAIL</label>
        <input type="email" id="signup-email" placeholder="you@example.com" required>

        <label>PASSWORD</label>
        <input type="password" id="signup-password" placeholder="Min. 6 characters" required>

        <label>CONFIRM PASSWORD</label>
        <input type="password" id="signup-password-confirm" required>

        <div id="signup-error" class="error"></div>
        <div id="signup-success" class="success"></div>

        <button class="btn" type="submit">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }

    function handleSignup(e) {
      e.preventDefault();

      const email = document.getElementById('signup-email').value.trim();
      const pwd = document.getElementById('signup-password').value;
      const pwd_confirm = document.getElementById('signup-password-confirm').value;

      document.getElementById('signup-error').textContent = '';
      document.getElementById('signup-success').textContent = '';

      if (!email || !pwd) {
        document.getElementById('signup-error').textContent = 'Email and password required';
        return;
      }
      if (pwd.length < 6) {
        document.getElementById('signup-error').textContent = 'Password must be at least 6 characters';
        return;
      }
      if (pwd !== pwd_confirm) {
        document.getElementById('signup-error').textContent = 'Passwords do not match';
        return;
      }

      fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pwd })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          document.getElementById('signup-success').textContent = 'Account created! Redirecting...';
          setTimeout(() => { window.location.href = '/'; }, 1500);
        } else {
          document.getElementById('signup-error').textContent = data.error || 'Signup failed';
        }
      })
      .catch(e => {
        document.getElementById('signup-error').textContent = 'Network error: ' + e;
      });
    }
  </script>
</body>
</html>
